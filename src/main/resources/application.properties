spring.application.name=EasyFactor

# --- Database (PostgreSQL) ---
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/easyfactor}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}

# --- JPA / Flyway ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Telegram Bot ---
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.bot.webhook-secret-token=${TELEGRAM_WEBHOOK_SECRET:}
telegram.bot.api-base-url=https://api.telegram.org
telegram.bot.init-data-max-age=24h

# --- JWT ---
security.jwt.issuer=easyfactor
security.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
security.jwt.access-token-ttl=PT1H
security.jwt.clock-skew=PT30S

# --- OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
